# config.yaml

data:
  path: "/storage/home/sqd5856/Desktop/default/protein_design/dataset/pretrain.h5"  # Path to the HDF5 dataset
  batch_size: 1            # Number of samples per batch
  max_num_ca: 500           # Maximum number of amino acids per protein
  max_T: 1000               # Maximum number of time steps

model:
  layers: 1                 # Number of EGNN layers
  hidden_dim: 16            # Hidden dimension size
  attn: false               # Enable attention mechanism (true/false)
  num_types: 27             # Number of residue types (A-Z)
  type_dim: 32              # Embedding dimension for residue types
  out_node_dim: 32          # Output node dimension
  output_pad_dim: 1         # Output dimension for padding prediction
  output_res_dim: 26        # Output dimension for residue type prediction
  pooling: true             # Enable pooling (true/false)
  noise: false              # Enable noise addition (true/false)

training:
  num_epochs: 20            # Total number of training epochs
  lr: 0.001                 # Learning rate
  weight_decay: 1e-5        # Weight decay for optimizer
  kl_weight: 0.01           # Weight for KL divergence loss

paths:
  checkpoint_dir: "./checkpoints"                                 # Directory to save model checkpoints
  log_dir: "./logs"                                               # Directory to save log files
  embeddings_path: "./checkpoints/protein_latent_embeddings.pt"  # Path to save latent embeddings

gpu:
  use_multi_gpu: true                                            # Whether to use multiple GPUs (true/false)

