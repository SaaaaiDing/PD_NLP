data:
  path: "/storage/home/sqd5856/Desktop/default/protein_design/dataset/pretrain.h5"  # Path to HDF5 dataset
  batch_size: 1            # Number of samples per batch
  max_num_ca: 500           # Maximum number of amino acids
  max_T: 1000               # Maximum number of time steps

model:
  layers: 1                 # Number of EGNN layers
  hidden_dim: 16            # Hidden layer dimension
  attn: false               # Whether to use attention mechanism
  num_types: 21             # Number of amino acid types (20 standard + 1 padding)
  type_dim: 32              # Amino acid type embedding dimension
  out_node_dim: 32          # Output node dimension
  output_pad_dim: 1         # Padding prediction output dimension
  output_res_dim: 21        # Amino acid type prediction output dimension (21 classes)
  pooling: false             # Whether to use pooling
  noise: false              # Whether to add noise

training:
  num_epochs: 2            # Total number of training epochs
  lr: 0.001                 # Learning rate
  weight_decay: 1e-5        # Optimizer weight decay
  kl_weight: 0.01           # KL divergence weight

paths:
  checkpoint_dir: "./MAIN1117nopool_checkpoints"                                 # Directory to save model checkpoints
  log_dir: "./MAIN1117nopool"                                               # Directory to save logs
  embeddings_path: "./MAIN1117nopool_checkpoints/protein_latent_embeddings.pt"  # Path to save latent embeddings

gpu:
  use_multi_gpu: true                                            # Whether to use multiple GPUs

